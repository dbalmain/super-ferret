[package]
name = "fm-screen"
description = "Experiment: a suffix array and an FM-index as regex screens (docs/FMINDEX.md). Outside the workspace so its dependencies stay out of main's Cargo.lock."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: not a member of the product's.
[workspace]

[dependencies]
ferret-verify = { path = "../../crates/ferret-verify" }
libsais = "0.2"
rayon = "1"
regex-syntax = "0.8"
rustix = { version = "1.1.5", features = ["fs", "std"] }
memchr = "2"
memmap2 = "0.9"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
